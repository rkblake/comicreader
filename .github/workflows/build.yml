name: Build & Release Comic Reader

on:
  push:
    branches: [ master ]
    tags:
      - 'v*'   # trigger release workflow when pushing tags like v1.0.0
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      # ----------------------------
      # Linux dependencies
      # ----------------------------
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev \
            libwayland-dev libxkbcommon-dev \
            libzip-dev \
            pkg-config \
            cmake g++ make git

      - name: Cache raylib installation (Linux)
        if: runner.os == 'Linux'
        id: cache-raylib
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/raylib-install
          key: raylib-linux-5.5

      - name: Build raylib from source
        if: runner.os == 'Linux' && steps.cache-raylib.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git /tmp/raylib
          cd /tmp/raylib
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_GAMES=OFF \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/raylib-install \
            ..
          cmake --build . --config Release --parallel $(nproc)
          cmake --install .

      # ----------------------------
      # macOS dependencies
      # ----------------------------
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install raylib libzip pkg-config cmake

      # ----------------------------
      # Windows dependencies (via vcpkg)
      # ----------------------------
      - name: Cache vcpkg
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/vcpkg
          key: vcpkg-${{ runner.os }}-${{ hashFiles('**/vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Setup vcpkg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone https://github.com/Microsoft/vcpkg.git ${{ github.workspace }}/vcpkg
          .\vcpkg\bootstrap-vcpkg.bat
          .\vcpkg\vcpkg.exe install raylib libzip --triplet x64-windows

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/raylib-install/lib/pkgconfig
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build (CMake)
        run: cmake --build build --config Release --parallel

      - name: Archive build outputs
        shell: bash
        run: |
          mkdir artifacts
          if [ "${{ runner.os }}" == "Linux" ]; then
            cp build/comic-reader artifacts/comic-reader-linux
          elif [ "${{ runner.os }}" == "macOS" ]; then
            cp build/comic-reader artifacts/comic-reader-macos
          else
            cp build/Release/comic-reader.exe artifacts/comic-reader-windows.exe
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: comic-reader-${{ runner.os }}
          path: artifacts/*

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release_artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
