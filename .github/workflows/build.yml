name: Build & Release Comic Reader

on:
  push:
    branches: [ master ]
    tags:
      - 'v*'   # trigger release workflow when pushing tags like v1.0.0
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      # ----------------------------
      # Linux system dependencies
      # ----------------------------
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev \
            libwayland-dev libxkbcommon-dev \
            zlib1g-dev \
            pkg-config \
            cmake g++ make git

      # ----------------------------
      # macOS system dependencies
      # ----------------------------
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install raylib libzip pkg-config cmake

      # ----------------------------
      # Linux dependencies built from source (static raylib + libzip)
      # ----------------------------
      - name: Cache native dependencies (Linux)
        if: runner.os == 'Linux'
        id: cache-deps
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/deps-install
          key: deps-${{ runner.os }}-${{ runner.arch }}-raylib-5.5-libzip-1.11.4-v2

      - name: Build native dependencies (Linux)
        if: runner.os == 'Linux' && steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          PREFIX="${{ github.workspace }}/deps-install"

          git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git /tmp/raylib
          cmake -S /tmp/raylib -B /tmp/raylib/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_GAMES=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_INSTALL_PREFIX="$PREFIX"
          cmake --build /tmp/raylib/build --config Release --parallel
          cmake --install /tmp/raylib/build

          git clone --depth 1 --branch v1.11.4 https://github.com/nih-at/libzip.git /tmp/libzip
          # Only zlib is needed for .cbz archives; disabling the optional
          # compression/crypto backends keeps the static library portable.
          cmake -S /tmp/libzip -B /tmp/libzip/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TOOLS=OFF \
            -DBUILD_REGRESS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_DOC=OFF \
            -DENABLE_BZIP2=OFF \
            -DENABLE_LZMA=OFF \
            -DENABLE_ZSTD=OFF \
            -DENABLE_OPENSSL=OFF \
            -DENABLE_GNUTLS=OFF \
            -DENABLE_COMMONCRYPTO=OFF \
            -DCMAKE_INSTALL_PREFIX="$PREFIX"
          cmake --build /tmp/libzip/build --config Release --parallel
          cmake --install /tmp/libzip/build

      # ----------------------------
      # Windows dependencies (via vcpkg)
      # The clone always runs (needed for the toolchain file); the downloaded
      # package archives + installed tree are cached separately and installed
      # only on a cache miss.
      # ----------------------------
      - name: Setup vcpkg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/Microsoft/vcpkg.git ${{ github.workspace }}/vcpkg
          .\vcpkg\bootstrap-vcpkg.bat

      - name: Cache vcpkg packages
        if: runner.os == 'Windows'
        id: cache-vcpkg
        uses: actions/cache@v6
        with:
          path: |
            ${{ github.workspace }}/vcpkg/downloads
            ${{ github.workspace }}/vcpkg/installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', '.github/workflows/build.yml') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Install vcpkg packages
        if: runner.os == 'Windows' && steps.cache-vcpkg.outputs.cache-hit != 'true'
        shell: pwsh
        run: .\vcpkg\vcpkg.exe install raylib libzip --triplet x64-windows

      # ----------------------------
      # Configure + build
      # ----------------------------
      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/deps-install/lib/pkgconfig
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Build (CMake)
        run: cmake --build build --config Release --parallel

      - name: Build AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          APPDIR="$RUNNER_TEMP/comic-reader.AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin"
          cp build/comic-reader "$APPDIR/usr/bin/comic-reader"
          cp packaging/appimage/AppRun "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"
          cp packaging/appimage/comic-reader.desktop "$APPDIR/comic-reader.desktop"
          python3 packaging/appimage/generate_icon.py "$APPDIR/comic-reader.png"

          curl -fL -o "$RUNNER_TEMP/appimagetool.AppImage" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool.AppImage"
          ARCH=x86_64 "$RUNNER_TEMP/appimagetool.AppImage" --appimage-extract-and-run \
            "$APPDIR" "${{ github.workspace }}/comic-reader-linux.AppImage"

      - name: Archive build outputs
        shell: bash
        run: |
          mkdir -p artifacts
          if [ "${{ runner.os }}" == "Linux" ]; then
            cp build/comic-reader artifacts/comic-reader-linux
            cp comic-reader-linux.AppImage artifacts/comic-reader-linux.AppImage
          elif [ "${{ runner.os }}" == "macOS" ]; then
            cp build/comic-reader artifacts/comic-reader-macos
          else
            cp build/Release/comic-reader.exe artifacts/comic-reader-windows.exe
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: comic-reader-${{ runner.os }}
          path: artifacts/*

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./release_artifacts
          merge-multiple: true

      - name: List downloaded release files
        run: find release_artifacts -type f -printf '%p (%s bytes)\n' | sort

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release_artifacts/comic-reader-linux
            release_artifacts/comic-reader-linux.AppImage
            release_artifacts/comic-reader-macos
            release_artifacts/comic-reader-windows.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
