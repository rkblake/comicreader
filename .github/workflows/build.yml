name: Build & Release Comic Reader

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'   # trigger release workflow when pushing tags like v1.0.0
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # ----------------------------
      # Linux dependencies
      # ----------------------------
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository ppa:texus/raylib || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libraylib-dev \
            libzip-dev \
            pkg-config \
            cmake g++ make

      # ----------------------------
      # macOS dependencies
      # ----------------------------
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install raylib libzip pkg-config cmake

      # ----------------------------
      # Windows dependencies (via vcpkg)
      # ----------------------------
      - name: Setup vcpkg
        if: runner.os == 'Windows'
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgArguments: 'raylib libzip'
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'

      - name: Configure (CMake)
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          ${{ runner.os == 'Windows' && '-DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake' || '' }}

      - name: Build (CMake)
        run: cmake --build build --config Release --parallel

      - name: Archive build outputs
        shell: bash
        run: |
          mkdir artifacts
          if [ "${{ runner.os }}" == "Linux" ]; then
            cp build/comic-reader artifacts/comic-reader-linux
          elif [ "${{ runner.os }}" == "macOS" ]; then
            cp build/comic-reader artifacts/comic-reader-macos
          else
            cp build/Release/comic-reader.exe artifacts/comic-reader-windows.exe
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: comic-reader-${{ runner.os }}
          path: artifacts/*

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release_artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
